[project]
name = "cv-video-surveillance"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.115.6", "uvicorn[standard]==0.34.0", "pydantic-settings==2.7.1",
  "sqlalchemy==2.0.36", "psycopg[binary]==3.2.3", "redis==5.2.1",
  "qdrant-client==1.12.1", "sentence-transformers==3.3.1", "torch==2.5.1",
  "httpx==0.27.2", "python-multipart==0.0.20", "opencv-python==4.10.0.84",
]

[project.optional-dependencies]
vision = ["ultralytics==8.4.0", "lap==0.5.12", "ollama==0.4.5"]
dev = ["pytest==8.3.4", "ruff==0.8.4", "mypy==1.13.0"]
train = ["scikit-learn==1.9.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
