services:
  api:
    build: .
    env_file: .env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
      qdrant:
        condition: service_started
    expose: ["8000"]
    ports: ["127.0.0.1:8000:8000"]
    restart: unless-stopped
  migrate:
    build: .
    command: python scripts/apply_migrations.py
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: surveillance
      POSTGRES_USER: surveillance
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes: [postgres-data:/var/lib/postgresql/data]
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U surveillance -d surveillance"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  redis:
    image: redis:7.4-alpine
    volumes: [redis-data:/data]
    ports: ["127.0.0.1:6379:6379"]
    restart: unless-stopped
  qdrant:
    image: qdrant/qdrant:v1.12.1
    volumes: [qdrant-data:/qdrant/storage]
    ports: ["127.0.0.1:6333:6333"]
    restart: unless-stopped
  web:
    image: nginx:1.27-alpine
    ports: ["127.0.0.1:8080:80"]
    volumes: [./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro, ./web:/usr/share/nginx/html:ro]
    depends_on: [api]
    restart: unless-stopped
volumes:
  postgres-data: {}
  redis-data: {}
  qdrant-data: {}
